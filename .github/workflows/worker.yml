name: Worker

# The routing worker's CI. `ci.yml` calls it for changes under `worker/`, to
# the API's golden fixtures (the contract job diffs them against the worker's
# copies) and to this file, so a website or API change does not pay for the
# worker's suite. A called workflow sees the caller's event, so
# `github.event_name` and `github.ref` below are those of the push or pull
# request that started `ci.yml`.
#
# The same path list appears twice: the `worker` filter of `ci.yml`'s
# `changes` job and the `Resolve the image commit` step of the publish job.
# `worker-release.yml` holds a third copy. Change them together — the release
# finds an image by asking git for the last commit that touched these paths.
#
# Tags are deliberately not a trigger here: a release promotes an image this
# workflow already built and tested on `main`, and rebuilding it would defeat
# that. See `worker-release.yml`.
on:
  workflow_call:
  # Run from `main`, this publishes like a push does. It is how a commit whose
  # push did not publish (the staging gate was still off, or the push's net
  # diff left the paths in `ci.yml` untouched) gets its image.
  workflow_dispatch:

# Nothing here writes to the repository. A pull request from a fork gets this
# read-only token and no secrets; the jobs that need more ask for it.
permissions:
  contents: read

env:
  # The package name predates the monorepo and Railway pins `:staging` and
  # `:prd` on it, so it is spelled out rather than derived from
  # `github.repository`.
  IMAGE: ghcr.io/andrewcgraves/sparks-effect-routing-worker

defaults:
  run:
    working-directory: worker

jobs:
  check:
    name: Test, lint, vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The exact patch comes from go.mod's `go` directive. It moves together
      # with the Dockerfile's golang image.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Test (with RabbitMQ integration)
        run: make itest

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: worker

      - name: Vulnerability scan
        run: make vulncheck

  contract:
    name: API↔worker contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-go and no network: check-contract is a diff between two
      # directories of the same checkout. Keep it that way — a variable that
      # expands `go` anywhere in the Makefile puts a toolchain download in
      # front of this job.
      - name: Diff the golden fixtures against the API
        run: make check-contract

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Build
        run: make build

  # Never runs for a pull request, so a fork cannot reach the registry.
  # STAGING_DEPLOY_ENABLED is a repository variable and the cutover switch:
  # until it is 'true' this job and the two below are skipped, and nothing is
  # published, redeployed or written to Linear.
  publish:
    name: Publish Docker image
    needs: [check, build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step below walks history to name the image.
          fetch-depth: 0

      # A push only starts this workflow when it touches the worker's paths,
      # so not every commit on `main` has an image. `worker-release.yml` finds
      # the image for a tag with this same command, and tagging the image with
      # its answer here is what makes the two agree: usually that is this
      # commit, but not when the last commit of a push left the paths alone,
      # and not on a manual run. Nothing under the paths changed in between,
      # so the build context is the same either way.
      #
      # --first-parent keeps the answer on `main` itself rather than on a
      # merged branch, whose commits were never built.
      - name: Resolve the image commit
        id: src
        run: |
          set -euo pipefail
          sha="$(git rev-list -1 --first-parent "$GITHUB_SHA" -- \
            worker \
            api/internal/routing/testdata \
            api/internal/handler/testdata \
            .github/workflows/worker.yml)"
          if [[ -z "$sha" ]]; then
            echo "::error::no commit at or before $GITHUB_SHA touches the worker's paths"
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "short=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `sha-<commit>` is the promotable artifact: immutable, and what
          # `worker-release.yml` re-tags as `:prd` when a release tag resolves
          # to this commit. `staging` is a moving tag for whatever the trunk
          # last built, and what the routing-worker-staging Railway service
          # pins. No `latest` — a moving tag something deploys from is how
          # production drifts with nobody choosing to move it.
          tags: |
            type=sha
            type=raw,value=sha-${{ steps.src.outputs.short }}
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Moving `:staging` does not by itself make Railway pull it. Railway's own
  # image auto-update polls GHCR and catches up within hours; this job is what
  # makes a merge land on staging within a minute. It is its own job, not a
  # step of `publish`, because the Railway token lives on the `production`
  # GitHub environment (both worker services share one Railway environment,
  # so one project token covers them) and the image publish should not wait
  # on anything that environment ever requires.
  deploy-staging:
    name: Redeploy the staging Railway service
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # This job reads nothing from the repository.
    permissions: {}
    # No checkout, so there is no `worker/` directory to run in.
    defaults:
      run:
        working-directory: .
    steps:
      # Skipped with a notice when the token is not set, rather than failing
      # a publish that did in fact push the image.
      - name: Redeploy routing-worker-staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::notice::RAILWAY_TOKEN is not set — image is tagged :staging; add a Railway project token to the production GitHub environment, or wait for Railway's image auto-update"
            exit 0
          fi

          npm install --global @railway/cli

          # The token is scoped to one Railway environment and that
          # environment holds both worker services, so the service name is
          # what keeps this off production.
          railway redeploy --service routing-worker-staging --yes

  # Staging is whatever `main` last published. Linear's staging pipeline is a
  # separate stream from production because the two environments can (and do)
  # hold different commits at the same time — see worker/docs/releases.md.
  linear-staging:
    name: Record staging release in Linear
    needs: [check, build, publish]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # linear-release-action scans commits since the last Linear release,
          # which needs the full history.
          fetch-depth: 0

      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step and
      # gates the action via an output, same idea as RAILWAY_TOKEN.
      - name: Check for the staging pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_STAGING: ${{ secrets.WORKER_LINEAR_ACCESS_KEY_STAGING }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_STAGING:-}" ]]; then
            echo "::notice::WORKER_LINEAR_ACCESS_KEY_STAGING is not set — create the Worker Build Staging pipeline in Linear and add its access key as this repository secret"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # install.sh inside linear-release-action downloads its CLI with a bare
      # curl and no retry, so a single connection reset from github.com fails
      # the job (curl exit 35). curl reads $CURL_HOME/.curlrc before its own
      # arguments, and the action's composite steps inherit $GITHUB_ENV, so
      # this makes every curl in the action retry without forking it.
      - name: Retry the Linear CLI download on transient network errors
        if: steps.linear.outputs.configured == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' 'retry = 5' 'retry-all-errors' 'retry-delay = 3' 'retry-max-time = 120' \
            > "$RUNNER_TEMP/.curlrc"
          echo "CURL_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Sync Linear staging release
        if: steps.linear.outputs.configured == 'true'
        uses: linear/linear-release-action@cfd42077dccdc0c26a38589934e2aa11046f57b7 # v0.18.3
        with:
          access_key: ${{ secrets.WORKER_LINEAR_ACCESS_KEY_STAGING }}
          # Only commits that touched the worker belong to this pipeline; the
          # API and the website record their own.
          include_paths: "worker/**"
          links: |
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/users/andrewcgraves/packages/container/package/sparks-effect-routing-worker
