name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

jobs:
  check:
    name: Test, lint, vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make itest` brings up a throwaway Postgres and RabbitMQ (via the same
      # Makefile targets used locally), runs the full suite with both sets of
      # integration tests enabled, then tears the containers down — DRY across
      # local and CI.
      #
      # CI is set on GitHub Actions, and the integration suites treat a missing
      # TEST_DATABASE_URL / TEST_AMQP_URL as a hard failure when it is present,
      # so a broken service here fails the job rather than silently skipping.
      - name: Test (with Postgres and RabbitMQ integration)
        run: make itest

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  contract:
    name: Message contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The golden fixture is supposed to be byte-identical in both
      # repositories, and before this job nothing checked it: the two copies
      # drifted for two releases and trace ids were silently dropped on this
      # side (SPA-227).
      #
      # It is a job of its own rather than a step of `check`, so a drift
      # failure reads as "the contract moved" and not as a broken test, and so
      # it still reports when the test job is red for its own reasons.
      #
      # This can go red without anything in this repository changing —
      # sparks-effect-api merging a new field is enough. That is the intended
      # behaviour: the drift is real from that moment, and the job says so
      # instead of leaving it to whoever next reads both files.
      - name: Diff the golden fixture against sparks-effect-api
        run: make check-contract

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparks-effect-routing-worker
          path: bin/sparks-effect-routing-worker

  publish:
    name: Publish Docker image
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `sha-<commit>` is the promotable artifact: immutable, and what
          # kustomize-config's production overlay pins. `staging` is a moving
          # tag for whatever the trunk last built.
          #
          # No `latest`. The cluster used to pull it, and Kubernetes defaults
          # imagePullPolicy: Always for `:latest` — so every pod restart was an
          # unrecorded production upgrade to whatever had merged most recently.
          tags: |
            type=sha
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
