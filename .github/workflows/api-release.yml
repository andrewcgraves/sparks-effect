name: API release

# Production is reached by tagging a commit, and by nothing else.
#
# The repository holds three services, so a release tag is namespaced:
# `api/vMAJOR.MINOR.PATCH`. The image tag it produces stays the bare `vX.Y.Z`.
#
# The tag names a commit that is already on `main`. This workflow never builds:
# it re-tags an image `main` already built as `:prd` (and as the release
# version) and asks Railway to pull it. A tag that does not point into `main`'s
# history is refused, so a feature branch has no path to production even if
# someone tags it.
#
# Which image: `api.yml` is path-filtered, so not every commit on `main` has
# one. The image promoted is that of the last commit at or before the tag that
# touched the API's trigger paths — nothing the image is built from changed
# between that commit and the tag.
on:
  push:
    tags: ["api/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote, e.g. api/v1.4.2. Pass an older tag to roll back."
        required: true
        type: string
      base_ref:
        description: "Optional exclusive git ref for Linear's commit scan (e.g. api/v0.1.0, or a commit SHA). Leave empty to scan from the previous api/v* tag. Set it for the first monorepo release, which has no previous tag."
        required: false
        type: string
      linear_only:
        description: "Skip image re-tag and Railway redeploy; only re-sync Linear for this tag."
        required: false
        type: boolean
        default: false

# Two promotions racing would leave `:prd` pointing at whichever re-tag landed
# last rather than whichever was asked for last. The group is per service: the
# worker's and the website's releases move different things.
concurrency:
  group: api-release-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The package name predates the monorepo and Railway pins `:prd` on it, so
  # it is spelled out rather than derived from `github.repository`.
  IMAGE: ghcr.io/andrewcgraves/sparks-effect-api

jobs:
  promote:
    name: Promote image to production
    # PRODUCTION_RELEASE_ENABLED is a repository variable and the cutover
    # switch: until it is 'true' a pushed tag promotes nothing.
    if: vars.PRODUCTION_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Scopes the Railway credential to production and gives the repo one place
    # to require an approval before prd moves.
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ancestry check below is what keeps a tag on a feature branch out
          # of production, and it needs the full history to answer.
          fetch-depth: 0

      - name: Resolve the tag, its commit and the image commit
        id: target
        env:
          # Empty on a tag push, in which case the pushed tag is the target.
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^api/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$tag' is not an API release tag (expected api/vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          # The image tag and the Linear version stay the bare vX.Y.Z.
          version="${tag#api/}"

          if ! git fetch --force origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "::error::tag '$tag' does not exist"
            exit 1
          fi

          # rev-list dereferences an annotated tag to the commit it wraps; using
          # the ref directly would hand the tag object's own SHA to the checks.
          sha="$(git rev-list -n 1 "refs/tags/$tag")"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$tag points at $sha, which is not on main — refusing to promote"
            exit 1
          fi

          # The last commit at or before the tag that touched the paths
          # `api.yml` triggers on, which is the commit that workflow named the
          # image after. Same command and same paths as its publish job; keep
          # them in step.
          image_sha="$(git rev-list -1 --first-parent "$sha" -- \
            api \
            worker/internal/routing/testdata \
            worker/internal/store/testdata \
            .github/workflows/api.yml)"
          if [[ -z "$image_sha" ]]; then
            echo "::error::no commit at or before $tag touches the API's paths — there is no image to promote"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "image_sha=$image_sha"
            echo "short=${image_sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event.inputs.linear_only != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag that commit's image as prd
        if: github.event.inputs.linear_only != 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          src="$IMAGE:sha-$SHORT"

          # Only `main` publishes, and it publishes only after the test, vet,
          # lint and build jobs pass — so this tag existing is the proof that
          # the commit went through the trunk green. Missing means it did not,
          # which is exactly what promotion must refuse.
          #
          # A tag pushed right after the merge lands before main's CI has
          # published, and v0.5.1 failed here on exactly that (SPA-503). CI
          # takes about four minutes, so wait up to twenty before refusing.
          echo "Promoting $src as $VERSION"
          deadline=$(( SECONDS + 20 * 60 ))
          until docker buildx imagetools inspect "$src" > /dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error::$src was not published within 20 minutes — did the API workflow pass on main for $SHORT? If it never ran for that commit, run it by hand from main (Actions → API → Run workflow), then re-run this release"
              exit 1
            fi
            echo "$src is not published yet; waiting for main's CI"
            sleep 20
          done

          # `:prd` is what Railway deploys; `:$VERSION` is an immutable record
          # of what each release was, and what a rollback re-promotes.
          docker buildx imagetools create --tag "$IMAGE:prd" --tag "$IMAGE:$VERSION" "$src"
          docker buildx imagetools inspect "$IMAGE:prd"

      # Moving the `:prd` tag does not by itself make Railway pull it, so the
      # promotion would sit unshipped until someone clicked redeploy. Skipped
      # with a notice when the credential is not set, rather than failing a
      # promotion that did in fact re-tag the image.
      - name: Redeploy the production Railway service
        if: github.event.inputs.linear_only != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.API_RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::notice::RAILWAY_TOKEN is not set — image is tagged :prd, redeploy Railway by hand"
            exit 0
          fi

          # The Railway project token is shared with the worker's pipelines,
          # so the service name — not the token — is what makes this touch
          # the production API and nothing else. With no name there is no
          # safe default in a project that holds several services, so the
          # redeploy is left to be done by hand, as with a missing token.
          if [[ -z "${RAILWAY_SERVICE:-}" ]]; then
            echo "::warning::API_RAILWAY_SERVICE is not set — image is tagged :prd, redeploy the production API service in Railway by hand and set the variable"
            exit 0
          fi

          npm install --global @railway/cli

          railway redeploy --service "$RAILWAY_SERVICE" --yes

      # Linear scans this working tree, so it must be the promoted commit —
      # not `main`. A tag push already checks out that SHA; workflow_dispatch
      # of an older tag would otherwise scan trunk HEAD and attach issues
      # that are not in the promoted image.
      - name: Check out the promoted commit
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: git checkout --detach "$SHA"

      # Production is a different Linear pipeline from staging: the same issue
      # can sit on staging for a while before a tag promotes it, and staging
      # can already be several commits ahead. See api/docs/releases.md.
      #
      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step.
      - name: Check for the production pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_PRODUCTION: ${{ secrets.API_LINEAR_ACCESS_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_PRODUCTION:-}" ]]; then
            echo "::notice::API_LINEAR_ACCESS_KEY_PRODUCTION is not set — create the 'API production' pipeline in Linear and add its access key as a secret on the production environment"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # install.sh inside linear-release-action downloads its CLI with a bare
      # curl and no retry, so a single connection reset from github.com fails
      # the job (curl exit 35). curl reads $CURL_HOME/.curlrc before its own
      # arguments, and the action's composite steps inherit $GITHUB_ENV, so
      # this makes every curl in the action retry without forking it.
      - name: Retry the Linear CLI download on transient network errors
        if: steps.linear.outputs.configured == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' 'retry = 5' 'retry-all-errors' 'retry-delay = 3' 'retry-max-time = 120' \
            > "$RUNNER_TEMP/.curlrc"
          echo "CURL_HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # Operator base_ref wins. Otherwise the exclusive lower bound is the
      # previous api/vMAJOR.MINOR.PATCH tag, so a production release records
      # every issue since the last tag went to production — including when
      # Linear has no prior release SHA of its own. See api/docs/releases.md.
      #
      # The bare v* tags of the old sparks-effect-api repository were not
      # imported, so the first monorepo release finds no previous tag. That is
      # not an error: it falls through to Linear's automatic baseline unless
      # the run was dispatched with base_ref.
      #
      # Two Linear steps because `base_ref` has no "unset" value once written
      # — passing it empty would scan from nothing rather than letting Linear
      # pick its automatic baseline.
      - name: Resolve Linear scan base
        id: scan
        env:
          OVERRIDE: ${{ github.event.inputs.base_ref }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [[ -n "${OVERRIDE:-}" ]]; then
            echo "base_ref=${OVERRIDE}" >> "$GITHUB_OUTPUT"
            echo "Using dispatch base_ref ${OVERRIDE}"
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 --match 'api/v[0-9]*' "${SHA}^" 2>/dev/null || true)"
          if [[ -n "$prev" ]]; then
            echo "base_ref=${prev}" >> "$GITHUB_OUTPUT"
            echo "Scanning from previous tag ${prev}"
          else
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous api/v* tag — Linear will use its automatic baseline. To choose the range, re-run this workflow for the same tag with linear_only and base_ref set"
          fi

      - name: Sync Linear production release
        if: steps.linear.outputs.configured == 'true' && steps.scan.outputs.base_ref == ''
        uses: linear/linear-release-action@cfd42077dccdc0c26a38589934e2aa11046f57b7 # v0.18.3
        with:
          access_key: ${{ secrets.API_LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.version }}
          version: ${{ steps.target.outputs.version }}
          # Only commits that touched the API belong to this pipeline.
          include_paths: "api/**"
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/users/andrewcgraves/packages/container/package/sparks-effect-api

      - name: Sync Linear production release with explicit scan base
        if: steps.linear.outputs.configured == 'true' && steps.scan.outputs.base_ref != ''
        uses: linear/linear-release-action@cfd42077dccdc0c26a38589934e2aa11046f57b7 # v0.18.3
        with:
          access_key: ${{ secrets.API_LINEAR_ACCESS_KEY_PRODUCTION }}
          name: ${{ steps.target.outputs.version }}
          version: ${{ steps.target.outputs.version }}
          base_ref: ${{ steps.scan.outputs.base_ref }}
          # Only commits that touched the API belong to this pipeline.
          include_paths: "api/**"
          links: |
            Commit=${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.target.outputs.sha }}
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Image=https://github.com/users/andrewcgraves/packages/container/package/sparks-effect-api

      - name: Summarise
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
          SHORT: ${{ steps.target.outputs.short }}
          LINEAR_ONLY: ${{ github.event.inputs.linear_only }}
          BASE_REF: ${{ steps.scan.outputs.base_ref }}
        run: |
          {
            if [[ "${LINEAR_ONLY:-}" == "true" ]]; then
              echo "### Recorded \`$TAG\` in Linear"
              echo
              echo "- commit: \`$SHA\`"
              echo "- image left alone: \`$IMAGE:sha-$SHORT\` (\`:prd\` not moved)"
            else
              echo "### Promoted \`$TAG\` to production"
              echo
              echo "- commit: \`$SHA\`"
              echo "- image: \`$IMAGE:sha-$SHORT\`"
              echo "- now also tagged: \`:prd\`, \`:$VERSION\`"
            fi
            if [[ -n "${BASE_REF:-}" ]]; then
              echo "- Linear scan: \`${BASE_REF}..HEAD\`"
            else
              echo "- Linear scan: automatic baseline (no previous api/v* tag)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
