name: Website

# The website's CI. `ci.yml` only calls it for changes under `website/` (or to
# this file), so an API or worker change does not pay for a frontend build. A
# called workflow sees the caller's event, so `github.event_name` and
# `github.ref` below are those of the push or pull request that started
# `ci.yml`.
on:
  workflow_call:
  workflow_dispatch:

# Nothing here writes to the repository. A pull request from a fork gets this
# read-only token and no secrets.
permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  # One job rather than two. The build used to live in a separate job that
  # `needs:` the test job — so it never overlapped with it, and every run paid
  # for a second runner, checkout, Node setup and `npm ci` just to arrive at a
  # working tree identical to the one the first job already had. Steps in a
  # single job give the same ordering guarantee for one install: a failing lint
  # or test still stops the build.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Fails on a high or critical advisory in what ships to browsers.
      # --omit=dev leaves out the build and test toolchain, whose advisories
      # never reach a user; Dependabot still opens PRs for those.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test
      # `build` is `vue-tsc -b && vite build`, so this covers the typecheck too.
      - run: npm run build

  # Staging is whatever `main` last passed CI with a change under `website/`
  # (Vercel already deploys it). Linear's staging pipeline is a separate stream
  # from production because the two environments can hold different commits at
  # the same time — see website/docs/releases.md.
  #
  # Never runs for a pull request, so a fork cannot reach the Linear key. The
  # STAGING_DEPLOY_ENABLED repository variable is the cutover switch: until it
  # is 'true' this job is skipped and nothing is written to Linear.
  linear-staging:
    name: Record staging release in Linear
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # linear-release-action scans commits since the last Linear release,
          # which needs the full history.
          fetch-depth: 0

      # Secrets cannot be referenced in `if:` (GitHub treats that as a
      # workflow-file error), so the empty check lives in a shell step and
      # gates the action via an output.
      - name: Check for the staging pipeline key
        id: linear
        env:
          LINEAR_ACCESS_KEY_STAGING: ${{ secrets.WEBSITE_LINEAR_ACCESS_KEY_STAGING }}
        run: |
          set -euo pipefail
          if [[ -z "${LINEAR_ACCESS_KEY_STAGING:-}" ]]; then
            echo "::notice::WEBSITE_LINEAR_ACCESS_KEY_STAGING is not set — create the Website Build Staging pipeline key and add it as this repository secret"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Linear staging release
        if: steps.linear.outputs.configured == 'true'
        uses: linear/linear-release-action@cfd42077dccdc0c26a38589934e2aa11046f57b7 # v0.18.3
        with:
          access_key: ${{ secrets.WEBSITE_LINEAR_ACCESS_KEY_STAGING }}
          # Only commits that touched the website belong to this pipeline; the
          # API and the worker record their own.
          include_paths: "website/**"
          links: |
            CI run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
